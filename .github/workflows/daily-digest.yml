name: Daily Digest

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo '${{ secrets.SOURCES_JSON }}' > sources.json
      # Odbiorcy mailingu pochodzą z tabeli mailing_recipients (panel /dashboard/recipients).
      # Sekret SUBSCRIBERS_JSON jest nieużywany — do usunięcia ręcznie w ustawieniach repo.
      - run: npm run scrape && npm run send
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
